name: Deploy web app
# Publishes the website (site/) and the browser version of the app (under /app/) to GitHub Pages (enable Pages → "GitHub Actions" in repo settings).
on:
  push:
    branches: [main]
    paths-ignore: ['docs/wiki/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: { group: pages, cancel-in-progress: true }

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
      - run: npm run build
      - name: Assemble site (landing page at /, app at /app/)
        run: |
          mkdir -p _site/app
          cp -r site/. _site/
          cp -r dist/. _site/app/
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4

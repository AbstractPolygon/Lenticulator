<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; script-src 'self' 'wasm-unsafe-eval'; frame-src 'self' blob:; connect-src 'self' blob: data:"
    />
    <title>Lenticulator</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img src="./icon.svg" alt="" width="24" height="24" />
        <span>Lenticulator</span>
        <span id="app-version" class="version" title="Version"></span>
      </div>
      <div class="actions">
        <input id="file-input" type="file" accept="image/*,.mpo,.jps,.heic,.heif,.tif,.tiff,.psd,.psb" multiple hidden />
        <input id="project-input" type="file" accept=".json,.lenti,application/json" hidden />
        <div class="menu">
          <button id="btn-samples" class="btn icon" title="Samples" aria-label="Samples" aria-haspopup="menu" aria-expanded="false" aria-controls="samples-panel">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 22H4a2 2 0 0 1-2-2V6"/><path d="m22 13-1.3-1.3a2.4 2.4 0 0 0-3.4 0L11 18"/><circle cx="12" cy="8" r="2"/><rect width="16" height="16" x="6" y="2" rx="2"/></svg>
          </button>
          <div id="samples-panel" class="menu-panel" role="menu" aria-label="Samples" hidden>
            <div class="menu-title">Samples</div>
            <div id="samples-list"></div>
          </div>
        </div>
        <button id="btn-import" class="btn icon primary" title="Import images or folders" aria-label="Import images">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/><path d="M16 5h6M19 2v6"/></svg>
        </button>
        <button id="btn-open-project" class="btn icon" title="Open project" aria-label="Open project">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.2 10H20a2 2 0 0 1 1.9 2.5l-1.5 6A2 2 0 0 1 18.4 20H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.7.9l.8 1.2a2 2 0 0 0 1.7.9H18a2 2 0 0 1 2 2v2"/></svg>
        </button>
        <button id="btn-save-project" class="btn icon" title="Save project" aria-label="Save project">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></svg>
        </button>
        <div class="menu">
          <button id="btn-settings" class="btn icon" title="Settings" aria-label="Settings" aria-haspopup="dialog" aria-expanded="false" aria-controls="settings-panel">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          </button>
          <div id="settings-panel" class="menu-panel" role="dialog" aria-label="Settings" hidden>
            <div class="menu-title">Settings</div>
            <section class="menu-section">
              <div class="menu-heading">Appearance</div>
              <label>Theme
                <select id="theme">
                  <option value="system">System</option>
                  <option value="light">Light</option>
                  <option value="dark">Dark</option>
                  <option value="contrast">High contrast</option>
                </select>
              </label>
            </section>
            <section class="menu-section">
              <div class="menu-heading">Import</div>
              <label>Photoshop (PSD) files
                <select id="psd-import">
                  <option value="flat">Flattened image</option>
                  <option value="layers">Each layer as a frame</option>
                </select>
              </label>
              <label>Multi-page TIFF files
                <select id="tiff-import">
                  <option value="all">Every page as a frame</option>
                  <option value="first">First page only</option>
                </select>
              </label>
            </section>
            <!-- more settings sections go here -->
          </div>
        </div>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <!-- PRINT SETUP -->
        <details open class="panel">
          <summary>Print &amp; lens</summary>
          <div class="segmented" role="radiogroup" aria-label="Effect">
            <button type="button" role="radio" data-mode="3d" aria-checked="true">
              <strong>3D</strong>
            </button>
            <button type="button" role="radio" data-mode="animation" aria-checked="false">
              <strong>Animation</strong>
            </button>
          </div>
          <div class="grid2">
            <label class="full">Size preset
              <select id="size-preset"></select>
            </label>
            <label>Width <input id="width" type="number" min="0.1" step="0.01" /></label>
            <label>Height <input id="height" type="number" min="0.1" step="0.01" /></label>
            <label>Units
              <select id="units"><option value="in">inches</option><option value="mm">mm</option></select>
            </label>
            <label>Print DPI <input id="dpi" type="number" min="72" max="4800" step="1" list="dpi-list" /></label>
            <label>Lens LPI <input id="lpi" type="number" min="1" max="400" step="0.001" list="lpi-list" /></label>
            <label>Lens direction
              <select id="orientation">
                <option value="vertical">Vertical</option>
                <option value="horizontal">Horizontal</option>
              </select>
            </label>
            <label>Sampling
              <select id="sampling">
                <option value="blend">Blend</option>
                <option value="nearest">Nearest</option>
              </select>
            </label>
            <label class="check"><input id="reverse" type="checkbox" /> Reverse frame order</label>
            <label class="full">Strip phase <span class="val" id="phase-val"></span>
              <input id="phase" type="range" min="0" max="1" step="0.01" />
            </label>
          </div>
          <div id="lens-info" class="info"></div>
          <datalist id="dpi-list"></datalist>
          <datalist id="lpi-list"></datalist>
        </details>

        <!-- FRAMES -->
        <details open class="panel">
          <summary>Frames <span id="frame-count" class="badge">0</span></summary>
          <div id="dropzone" class="dropzone">
            Drop images or folders
          </div>
          <ol id="frame-list" class="frame-list"></ol>
          <div class="row">
            <button id="btn-reverse-order" class="btn small">Reverse order</button>
            <button id="btn-clear" class="btn small danger">Remove all</button>
          </div>
        </details>

        <!-- DEPTH (single photo → 3D) -->
        <details class="panel" id="depth-panel">
          <summary>Depth</summary>
          <canvas id="depth-thumb" class="depth-thumb" width="300" height="200" hidden></canvas>
          <div class="row">
            <button id="btn-depth-estimate" class="btn small primary">Estimate depth</button>
            <button id="btn-depth-load" class="btn small">Load depth map</button>
            <input id="depth-input" type="file" accept="image/*,.tif,.tiff,.psd,.heic" hidden />
          </div>
          <div class="grid2">
            <label>Frames <input id="d-frames" type="number" min="2" max="48" step="1" /></label>
            <label class="check"><input id="d-auto" type="checkbox" /> Match LPI</label>
            <label class="full">Depth <span class="val" id="d-amount-val"></span>
              <input id="d-amount" type="range" min="0" max="10" step="0.1" />
            </label>
            <label class="full">Focus
              <input id="d-focus" type="range" min="0" max="1" step="0.01" />
            </label>
            <label class="check"><input id="d-invert" type="checkbox" /> Invert</label>
          </div>
          <div class="row">
            <button id="btn-depth-generate" class="btn small primary" disabled>Generate frames</button>
          </div>
        </details>

        <!-- ALIGNMENT -->
        <details open class="panel">
          <summary>Alignment</summary>
          <label>Method
            <select id="align-mode">
              <option value="similarity">Shift + rotate + scale</option>
              <option value="translation">Shift only</option>
              <option value="keypoint">Key point</option>
            </select>
          </label>
          <div class="row">
            <button id="btn-pick-key" class="btn small" aria-pressed="false">Pick key point</button>
            <button id="btn-auto-align" class="btn small primary">Auto-align</button>
            <button id="btn-reset-align" class="btn small">Reset</button>
          </div>
          <fieldset id="manual-align" class="manual">
            <legend>Selected frame <span id="sel-name"></span></legend>
            <div class="grid4">
              <label>X px <input id="t-dx" type="number" step="0.1" /></label>
              <label>Y px <input id="t-dy" type="number" step="0.1" /></label>
              <label>Rotate ° <input id="t-rot" type="number" step="0.05" /></label>
              <label>Scale <input id="t-scale" type="number" step="0.001" min="0.2" max="5" /></label>
            </div>
          </fieldset>
        </details>

        <!-- FRAMING -->
        <details class="panel">
          <summary>Framing &amp; page</summary>
          <div class="grid2">
            <label>Fit
              <select id="fit"><option value="cover">Fill</option><option value="contain">Fit</option></select>
            </label>
            <label>Background <input id="bg" type="color" /></label>
            <label class="full">Zoom <span class="val" id="zoom-val"></span>
              <input id="zoom" type="range" min="1" max="3" step="0.01" />
            </label>
            <label class="full">Pan X <input id="panX" type="range" min="-0.5" max="0.5" step="0.005" /></label>
            <label class="full">Pan Y <input id="panY" type="range" min="-0.5" max="0.5" step="0.005" /></label>
            <label>Margin <input id="margin" type="number" min="0" step="0.05" /></label>
            <span></span>
            <label class="check"><input id="alignBars" type="checkbox" /> Lens alignment bars</label>
            <label class="check"><input id="cropMarks" type="checkbox" /> Crop marks</label>
          </div>
        </details>

        <!-- TEST PATTERNS -->
        <details class="panel">
          <summary>Test patterns</summary>
          <label>Pattern
            <select id="pattern-type">
              <option value="pitch">Pitch test</option>
              <option value="ruler">Lens ruler</option>
              <option value="frames">Frame order</option>
            </select>
          </label>
          <div class="grid2" id="pitch-opts">
            <label>± range (LPI) <input id="pt-range" type="number" min="0.05" step="0.05" value="1" /></label>
            <label>Step <input id="pt-step" type="number" min="0.01" step="0.01" value="0.1" /></label>
          </div>
          <div class="grid2" id="frames-opts" hidden>
            <label>Test frames <input id="ft-count" type="number" min="2" max="64" step="1" value="6" /></label>
          </div>
          <button id="btn-pattern" class="btn small primary">Generate test pattern</button>
        </details>

        <!-- EXPORT -->
        <details open class="panel">
          <summary>Render &amp; export</summary>
          <div class="row">
            <button id="btn-render" class="btn primary">Render interlaced image</button>
          </div>
          <div class="progress" hidden><div id="progress-bar"></div></div>
          <div class="row">
            <div id="export-format" class="seg" role="radiogroup" aria-label="Export format">
              <button type="button" role="radio" data-format="png">PNG</button>
              <button type="button" role="radio" data-format="jpg">JPG</button>
              <button type="button" role="radio" data-format="tiff">TIF</button>
              <button type="button" role="radio" data-format="gif">GIF</button>
              <button type="button" role="radio" data-format="video">Video</button>
            </div>
            <button id="btn-download" class="btn small" disabled>Download</button>
            <button id="btn-print" class="btn small" disabled>Print…</button>
          </div>
        </details>
      </aside>

      <main class="stage">
        <div class="tabbar">
          <nav class="tabs" role="tablist">
            <button role="tab" data-tab="align">Align</button>
            <button role="tab" data-tab="preview" aria-selected="true">Preview</button>
            <button role="tab" data-tab="output">Output</button>
          </nav>
          <div class="zoom" id="zoom-controls" role="group" aria-label="Zoom">
              <button class="btn small" data-z="out" title="Zoom out (−)" aria-label="Zoom out">−</button>
              <button class="btn small zoom-label" data-z="actual" title="Actual pixels (1)">100%</button>
              <button class="btn small" data-z="in" title="Zoom in (+)" aria-label="Zoom in">+</button>
              <button class="btn small" data-z="fit" title="Fit to window (0)">Fit</button>
            </div>
        </div>

        <section id="tab-preview" class="tab-pane" role="tabpanel">
          <div class="canvas-wrap"><canvas id="preview-canvas"></canvas></div>
          <div class="toolbar">
            <button id="btn-play" class="btn small">▶ Play</button>
            <input id="view" class="grow" type="range" min="0" max="1" step="0.001" value="0.5" aria-label="View angle" />
            <label class="check"><input id="preview-blend" type="checkbox" checked /> Smooth</label>
              <select id="preview-mode" aria-label="Preview mode">
                <option value="tilt">Tilt</option>
                <option value="onion">Onion skin</option>
                <option value="difference">Difference</option>
                <option value="flicker">Flicker</option>
                <option value="anaglyph">Anaglyph</option>
              </select>
          </div>
        </section>

        <section id="tab-align" class="tab-pane" role="tabpanel" hidden>
          <div class="canvas-wrap"><canvas id="align-canvas"></canvas></div>
          <div class="toolbar">
              <select id="overlay-mode" aria-label="Overlay">
                <option value="onion">Onion skin</option>
                <option value="difference">Difference</option>
                <option value="flicker">Flicker</option>
                <option value="frame">Selected only</option>
                <option value="anaglyph">Anaglyph</option>
              </select>
            <label class="grow">Opacity <input id="overlay-opacity" type="range" min="0" max="1" step="0.01" value="0.5" /></label>
            <label class="check"><input id="show-crop" type="checkbox" checked /> Show print area</label>
          </div>
        </section>

        <section id="tab-output" class="tab-pane" role="tabpanel" hidden>
          <div class="canvas-wrap" id="output-wrap"><canvas id="output-canvas"></canvas></div>
          <div class="toolbar">
            <span id="output-title" class="grow">Nothing rendered yet.</span>
          </div>
        </section>
        <div id="status" class="status" role="status" aria-live="polite"></div>
      </main>
    </div>
    <div class="drop-overlay" aria-hidden="true">
      <div class="drop-card">
        <strong>Drop to add frames</strong>
        <span>Images or folders of images · sorted by file name</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

name: Desktop builds
# Builds installers for Linux (AppImage, Snap), Windows (NSIS installer: x64, arm64, 32-bit) and macOS (DMG).
# - Manual run (Actions → Desktop builds → Run workflow): installers are attached to the run as artifacts.
#   Tick "publish" to also publish them as the public GitHub release v<package.json version>
#   (the release and its tag are created on GitHub for the commit that was built).
# - Tag push (v*): installers are published to that release.
# Build jobs never publish; the final `release` job uploads everything once all platforms succeed.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the installers as the public release v<version>
        type: boolean
        default: false
  push:
    tags: ['v*']


permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Install snapcraft
        run: |
          sudo snap install snapcraft --classic
          sudo snap install core22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build AppImage and Snap
        run: npx electron-builder --linux --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: lenticulator-linux
          path: |
            release/*.AppImage
            release/*.snap
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Build NSIS installer
        run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: lenticulator-windows
          path: release/*.exe
          if-no-files-found: error

  # Electron dropped 32-bit Windows after version 43, so this installer is built with the last 43.x release.
  windows-ia32:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Build 32-bit NSIS installer (Electron 43)
        shell: bash
        run: npx electron-builder --win nsis --ia32 --publish never --config.electronVersion=43.8.6
      - uses: actions/upload-artifact@v4
        with:
          name: lenticulator-windows-ia32
          path: release/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Build DMG (Intel and Apple silicon)
        run: npx electron-builder --mac --publish never
        env:
          # No Developer ID certificate. The app still gets an ad-hoc signature (build/mac-adhoc-sign.cjs), without which
          # Apple Silicon calls it damaged and refuses to open it.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check the macOS apps' signatures
        run: |
          for app in release/mac*/*.app; do
            echo "$app"
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv "$app" 2>&1 | grep -E 'Signature=adhoc|Identifier='
          done
          # the disk images hold the same signed apps: mount each and check the app inside
          for dmg in release/*.dmg; do
            mnt=$(mktemp -d)
            hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mnt" > /dev/null
            codesign --verify --deep --strict "$mnt"/*.app && echo "$dmg: app signature valid"
            hdiutil detach "$mnt" > /dev/null
          done
      - name: Run the macOS apps (Apple Silicon, and Intel under Rosetta)
        run: |
          softwareupdate --install-rosetta --agree-to-license > /dev/null 2>&1 || true
          for app in release/mac*/*.app; do
            bin="$app/Contents/MacOS/$(defaults read "$(pwd)/$app/Contents/Info" CFBundleExecutable)"
            echo "== $app ($(lipo -archs "$bin"))"
            # the binary starts (macOS accepts its signature) ...
            ELECTRON_RUN_AS_NODE=1 "$bin" -e 'console.log("runs as", process.arch)'
            # ... and the whole app launches and keeps running
            "$bin" > /tmp/app.log 2>&1 &
            pid=$!
            sleep 15
            if ! kill -0 "$pid" 2>/dev/null; then cat /tmp/app.log; echo "$app exited early"; exit 1; fi
            kill "$pid"; wait "$pid" 2>/dev/null || true
            echo "$app launched"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: lenticulator-macos
          path: release/*.dmg
          if-no-files-found: error

  # Publishes all installers in one step once every platform has built (avoids jobs racing to create the
  # release, and never uploads anywhere but GitHub releases).
  release:
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish
    needs: [linux, windows, windows-ia32, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: installers, merge-multiple: true }
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          # release notes = this version's CHANGELOG section
          awk -v v="## $V" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          if ! gh release view "v$V" >/dev/null 2>&1; then
            gh release create "v$V" --target "$GITHUB_SHA" --title "Lenticulator $V" --notes-file notes.md
          fi
          gh release upload "v$V" installers/* --clobber
          ls -la installers

name: Desktop builds
# Builds installers for Linux (AppImage, Snap), Windows (NSIS installer) and macOS (DMG).
# - Manual run (Actions → Desktop builds → Run workflow): installers are attached to the run as artifacts.
#   Tick "publish" to also publish them as the public GitHub release v<package.json version>
#   (the release and its tag are created on GitHub for the commit that was built).
# - Tag push (v*): installers are published to that release.
# Build jobs never publish; the final `release` job uploads everything once all platforms succeed.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the installers as the public release v<version>
        type: boolean
        default: false
  push:
    tags: ['v*']


permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Install snapcraft
        run: |
          sudo snap install snapcraft --classic
          sudo snap install core22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build AppImage and Snap
        run: npx electron-builder --linux --publish never
        env:
      - uses: actions/upload-artifact@v4
        with:
          name: lenticulator-linux
          path: |
            release/*.AppImage
            release/*.snap
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Build NSIS installer
        run: npx electron-builder --win --publish never
        env:
      - uses: actions/upload-artifact@v4
        with:
          name: lenticulator-windows
          path: release/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Build DMG (Intel and Apple silicon)
        run: npx electron-builder --mac --publish never
        env:
          # unsigned unless signing certificates are added as secrets (CSC_LINK / CSC_KEY_PASSWORD)
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: lenticulator-macos
          path: release/*.dmg
          if-no-files-found: error

  # Publishes all installers in one step once every platform has built (avoids jobs racing to create the
  # release, and never uploads anywhere but GitHub releases).
  release:
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: installers, merge-multiple: true }
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          # release notes = this version's CHANGELOG section
          awk -v v="## $V" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          if ! gh release view "v$V" >/dev/null 2>&1; then
            gh release create "v$V" --target "$GITHUB_SHA" --title "Lenticulator $V" --notes-file notes.md
          fi
          gh release upload "v$V" installers/* --clobber
          ls -la installers
